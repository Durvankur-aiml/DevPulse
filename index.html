<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse - DevOps Command Palette</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>DevPulse 🚀</h1>
        <p>DevOps & Cloud Command Quick Reference</p>

    </main>

    <script src="assets/js/app.js"></script>

</html>
