name: DevPulse CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Stage 1: Continuous Integration (Linting and Structure Verification)
  ci-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Core Web Assets
        run: |
          echo "Starting CI Pipeline Checks..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f assets/css/style.css || (echo "Missing style.css" && exit 1)
          test -f assets/js/app.js || (echo "Missing app.js" && exit 1)
          echo "CI Pipeline Passed: All production assets verified!"

  # Stage 2: Continuous Deployment (Deploy to GitHub Pages)
  cd-deployment:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci-verification
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
